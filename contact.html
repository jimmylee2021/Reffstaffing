<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
     <link rel="stylesheet" href="css/about.css">
    <link rel="stylesheet" href="css/service.css">
    <link rel="stylesheet" href="css/contact.css">
    <script src="https://kit.fontawesome.com/dc287775fc.js" crossorigin="anonymous"></script>
    <title>Refstaffing | Contact</title>
</head>
<body>
    <div id="header"></div>
     <section class="home" id="contact">
        <div class="home-div">
            <div class="home-content">
            <div class="h1-div">
                <h1>Contact Us</h1>
            </div>
            <div class="small-div">
                  <p>We are here to provide solutions according to your needs</p>
            </div>
        </div>
        </div>
    </section>
    <section class="form">
        <div class="form-div">
            <form action="">
                 <div class="form-txt">
                <h1>Get in Touch</h1>
             <p>Let’s work together to support care and enrich lives.</p>
            </div>
                <div class="form-input">
                    <label for="name">Name</label> <br> <br>
                     <input type="text"  id="name">
                </div>
                <div class="form-input">
                    <label for="email">Email</label> <br> <br>
                     <input type="email" >
                </div>
                <div class="form-input">
                    <label for="subject">Subject</label> <br> <br>
                     <input type="email" >
                </div>
                <div class="form-input">
                    <label for="message">Message</label> <br> <br>
                     <textarea ></textarea>
                </div>
                <button type="submit">Send Message</button>
            </form>
            <div class="contact-div">
                <div class="contact-boxes">
                    <div class="contact-box-items">
                        <div class="contact-bx-img">
                            <img src="img/Group 72.png" alt="">
                        </div>
                        <div class="contact-bx-header">
                            <h1>Phone Number</h1>
                        </div>
                        <div class="contact-bx-p">
                            <p>Leicester, United Kingdom </p>
                        </div>
                    </div>
                </div>
                <div class="contact-boxes">
                     <div class="contact-box-items">
                        <div class="contact-bx-img">
                            <img src="img/Group 73.png" alt="">
                        </div>
                        <div class="contact-bx-header">
                            <h1>Email Address</h1>
                        </div>
                        <div class="contact-bx-p">
                            <p>Leicester, United Kingdom </p>
                        </div>
                    </div>
                </div>
                <div class="contact-boxes">
                     <div class="contact-box-items">
                        <div class="contact-bx-img">
                            <img src="img/Group 74.png" alt="">
                        </div>
                        <div class="contact-bx-header">
                            <h1>Our Location</h1>
                        </div>
                        <div class="contact-bx-p">
                            <p>Leicester, United Kingdom </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
   <div id="footer"></div>
         <script src="js/app.js"></script>
</body>
</html>
